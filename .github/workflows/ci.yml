name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA; the comment gives the release they point to.
jobs:
  build:
    name: Build and check translations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check translations
        run: java tools/LangCheck.java

      - name: Build
        run: ./gradlew build --console=plain

      # Starts a headless dev server and runs every GameTest of the mod. Gradle exits 0 even when the server fails to
      # start (for example on a dependency error), so the step also requires the "tests passed" line in the output.
      - name: Run GameTests (Create 6.0.10, the minimum)
        run: |
          ./gradlew runGameTestServer --console=plain | tee gametest.log
          grep -q "required tests passed" gametest.log

      - name: Run GameTests (Create 6.0.11)
        run: |
          ./gradlew runGameTestServer -Pcreate_version=6.0.11-319 --console=plain | tee gametest.log
          grep -q "required tests passed" gametest.log

      - name: Upload GameTest logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gametest-logs
          path: run/gametest/logs/
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: create_pocketdynamo-jar
          path: build/libs/*.jar
          if-no-files-found: error

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
