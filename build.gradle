plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Each remote repository only serves the groups listed here, so a name clash on another host cannot win.
repositories {
    maven {                                                    // Create, Ponder, Flywheel
        url = 'https://maven.createmod.net'
        content {
            includeGroupAndSubgroups 'com.simibubi'
            includeGroupAndSubgroups 'net.createmod'
            includeGroupAndSubgroups 'dev.engine-room'
        }
    }
    maven {                                                    // Registrate
        url = 'https://maven.ithundxr.dev/snapshots'
        content { includeGroupAndSubgroups 'com.tterrag' }
    }
    maven {                                                    // NeoForge config API port, needed by Ponder
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven'
        content { includeGroupAndSubgroups 'fuzs' }
    }
    maven {                                                    // JEI
        url = 'https://maven.blamejared.com'
        content { includeGroupAndSubgroups 'mezz' }
    }
    maven {                                                    // EMI (official maven, see EMI's README)
        url = 'https://repo.sleeping.town/'
        content { includeGroup 'dev.emi' }
    }
}

// GameTests live in their own source set, so they are not packed into the mod jar. They see the main classes and
// the same Create/NeoForge dependencies, and load as part of this mod in the gameTestServer run.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.gametest)

    if (parchment_version != 'none') {
        parchment {
            minecraftVersion = parchment_minecraft_version == 'same' ? minecraft_version : parchment_minecraft_version
            mappingsVersion = parchment_version
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArgument '-XX:+IgnoreUnrecognizedVMOptions'
            jvmArgument '-XX:+AllowEnhancedClassRedefinition'
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // ./gradlew runGameTestServer: runs every GameTest of this mod and exits non-zero if one fails.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Create and the libraries it normally jar-in-jars; in the dev environment they must be explicit.
    // Create's own pom lists optional compat mods (Farmers Delight, FTB...) that are not on our repositories, and its
    // runtime libraries are declared below, so its transitive dependencies are skipped.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    // Create 6.0.10 needs Vanillin at runtime (6.0.11 no longer lists it).
    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:1.1.3-41")
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Recipe viewers: API only at compile time. The plugin classes load only if the viewer is present.
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api")

    // One viewer at runtime in the dev client, chosen in gradle.properties.
    // (runtimeOnly is fine here: this project is built as a jar, not published as a Maven artifact.)
    if (dev_recipe_viewer == 'jei') {
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    } else if (dev_recipe_viewer == 'emi') {
        runtimeOnly("dev.emi:emi-neoforge:${emi_version}")
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : create_version_range,
            flywheel_version_range : flywheel_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Compile the GameTests on every build, so a broken test cannot slip in unnoticed.
tasks.named('check') { dependsOn tasks.named('compileGametestJava') }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
